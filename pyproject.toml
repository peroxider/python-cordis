[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-cordis"
version = "0.1.2"
description = "A plugin-driven framework kernel for Python, inspired by the cordis framework (everything is a plugin)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["plugin", "framework", "cordis", "dependency-injection", "composition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pluggy>=1.0",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "mypy>=1.10",
    "build>=1.0",
]
hmr = [
    "watchdog>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"python_cordis" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/python_cordis"]
