<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>python-cordis · 参考前端</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; }
    header { padding: 12px 16px; border-bottom: 1px solid #8884; }
    header h1 { font-size: 16px; margin: 0; display: inline-block; }
    header span { margin-left: 12px; color: #888; font-size: 12px; }
    #sessions { padding: 8px 16px; border-bottom: 1px solid #8884; font-size: 13px; }
    #sessions button { margin-right: 6px; }
    #log { padding: 12px 16px; min-height: 60vh; font-family: ui-monospace, monospace; font-size: 13px; }
    .ev { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
    .ev .tag { display: inline-block; min-width: 150px; color: #888; }
    .ev.surface { background: #8882; border-radius: 4px; padding: 4px 6px; }
    #approval { padding: 8px 16px; border-bottom: 1px solid #a58; font-size: 13px; }
    .approval-card { border: 1px solid #a58; border-radius: 6px; padding: 8px 10px; margin: 6px 0; background: #a581; }
    .approval-card .a-title { font-weight: 600; margin-bottom: 4px; }
    .approval-card pre { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
    .approval-card button { margin-right: 8px; }
    footer { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid #8884; background: #fff8; backdrop-filter: blur(4px); }
    #input { flex: 1; padding: 8px; }
    #status { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>python-cordis 参考前端</h1>
    <span id="status">连接中…</span>
  </header>
  <div id="sessions"></div>
  <div id="approval"></div>
  <div id="log"></div>
  <footer>
    <input id="input" type="text" placeholder="输入消息，回车发送（HTTP 上行 → Agent → WS 下行实时渲染）" autocomplete="off" />
    <button id="send">发送</button>
    <button id="ping" title="触发一次服务端 ask → client-response 往返">ask 往返</button>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
